<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Teletele's Blog</title>
    <meta name="description" content="Teletele 的技术博客，记录 PostgreSQL 内核学习、开发工具实践，以及与 AI 的对话和思考。">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8fafc">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <!-- 固定依赖版本，避免 CDN 自动升级影响页面。 -->
    <link id="theme-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/css/theme-simple.css">
    <link id="theme-dark" rel="stylesheet" media="not all" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/css/theme-simple-dark.css">
    <link rel="stylesheet" href="assets/custom.css">
    <script src="assets/theme.js"></script>
</head>
<body>
    <a class="skip-link" href="#main">跳到正文</a>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到深色模式">深色模式</button>
    <div id="app">加载中…</div>
    <noscript>请启用 JavaScript 阅读博客，也可以在 <a href="https://github.com/Teletele-Lin/teletele-lin.github.io/tree/main/docs">GitHub</a> 阅读原始文章。</noscript>
    <script>
        window.$docsify = {
            name: '<span class="site-name">Teletele<span class="site-dot">.</span></span><span class="site-tagline">技术 · 实践 · 思考</span>',
            nameLink: '#/',
            loadSidebar: true,
            loadNavbar: true,
            alias: {
                '/.*/_sidebar.md': '/_sidebar.md',
                '/.*/_navbar.md': '/_navbar.md'
            },
            coverpage: false,
            auto2top: true,
            maxLevel: 4,
            subMaxLevel: 3,
            mergeNavbar: true,
            nativeEmoji: true,
            themeable: { readyTransition: false, responsiveTables: true },
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: '搜索文章与笔记',
                noData: '没有找到相关内容，换个关键词试试。',
                depth: 4,
                hideOtherSidebarContent: true,
                namespace: 'teletele-blog-v2'
            },
            copyCode: { buttonText: '复制', successText: '已复制', errorText: '复制失败' },
            plugins: [function (hook) {
                hook.doneEach(function () {
                    var article = document.querySelector('.markdown-section');
                    if (article) {
                        article.tabIndex = -1;
                    }
                    var toggle = document.querySelector('.sidebar-toggle');
                    if (toggle) toggle.setAttribute('aria-label', '切换文章导航');
                });
            }]
        };
        document.querySelector('.skip-link').addEventListener('click', function (event) {
            var article = document.getElementById('main');
            if (article) {
                event.preventDefault();
                event.stopPropagation();
                article.focus();
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/js/docsify-themeable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-sql.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-rust.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"></script>
</body>
</html>
